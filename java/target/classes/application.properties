# Device Health Analytics API Configuration
# Apple-style: Explicit configuration, no magic defaults

# Server configuration
server.port=8080
server.error.include-stacktrace=never
server.error.include-message=always

# Logging configuration
logging.level.root=INFO
logging.level.com.apple.telemetry=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Python analytics configuration
analytics.python.executable=python3
analytics.python.script=python/analytics_api.py
analytics.timeout.seconds=30

# Jackson JSON configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
